<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dragon Rider</title>
<style>
  /* Un seul monde visuel : un crépuscule gothique en 16 bits. Pas de variante claire/sombre. */
  [hidden] { display: none !important; }
  :root {
    --fond: #07060b;
    --croix: #1f1b25;
    --croix-creux: #141118;
    --sang: #8e2230;
    --bronze: #8f7a52;
    --panneau: #25212b;
    --panneau-ombre: #19161e;
    --etiquette: #8c7c83;
    --b: clamp(44px, 8vmin, 60px);
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--fond);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  #jeu {
    position: fixed; inset: 0; touch-action: none; background: var(--fond);
    display: flex; align-items: center; justify-content: center;
  }
  #jeu.portrait { flex-direction: column; justify-content: flex-start; padding-top: env(safe-area-inset-top, 0px); }
  #ecran { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }

  .manette {
    position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  }
  #jeu.paysage .manette { opacity: .72; }
  #jeu.portrait .manette {
    position: relative; flex: 1; align-items: center; width: 100%; box-sizing: border-box;
    background: linear-gradient(var(--panneau), var(--panneau-ombre));
    border-top: 3px solid #3a3440; padding-top: 10px;
  }
  .croix {
    pointer-events: auto; display: grid;
    grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b));
    grid-template-areas: ". haut ." "gauche moyeu droite" ". bas .";
    filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45));
  }
  .croix button, .moyeu { background: var(--croix); border: 0; padding: 0; }
  .croix button {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    color: #6f6679; display: grid; place-items: center;
  }
  .croix button svg { width: 38%; height: 38%; fill: currentColor; }
  .croix button.on { background: var(--croix-creux); color: #b5aab0; }
  #btn-haut { grid-area: haut; border-radius: 7px 7px 0 0; }
  #btn-bas { grid-area: bas; border-radius: 0 0 7px 7px; }
  #btn-gauche { grid-area: gauche; border-radius: 7px 0 0 7px; }
  #btn-droite { grid-area: droite; border-radius: 0 7px 7px 0; }
  .moyeu { grid-area: moyeu; display: grid; place-items: center; }
  .moyeu::after { content: ""; width: 42%; height: 42%; border-radius: 50%; background: var(--croix-creux); }

  .actions { pointer-events: auto; display: flex; gap: 14px; align-items: flex-start; }
  .action { display: grid; justify-items: center; gap: 5px; }
  .action:first-child { margin-top: calc(var(--b) * .55); }
  .rond {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    width: calc(var(--b) * 1.3); height: calc(var(--b) * 1.3); border-radius: 50%; border: 0; padding: 0;
    font-family: inherit; font-weight: 800; font-size: calc(var(--b) * .38); line-height: 1;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .28), 0 3px 0 rgba(0, 0, 0, .5);
    transition: transform .06s;
  }
  .rond.on { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .28), 0 1px 0 rgba(0, 0, 0, .5); }
  #btn-ruee { background: var(--bronze); color: #231a0e; }
  #btn-feu { background: var(--sang); color: #efe6da; }
  .action span { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #cfc6ba; text-shadow: 0 1px 0 #000; }
  #jeu.portrait .action span { color: var(--etiquette); text-shadow: none; }
  button:focus-visible { outline: 2px solid #d8d0c4; outline-offset: 2px; }
</style>

<div id="jeu" class="paysage">
  <canvas id="ecran" aria-label="Dragon Rider : un dragonnier traverse un monde éteint, des terres décharnées jusqu'aux cryptes"></canvas>
  <div class="manette">
    <div class="croix" aria-label="Croix directionnelle">
      <button type="button" id="btn-haut" data-k="up" aria-label="Monter"><svg viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg></button>
      <button type="button" id="btn-gauche" data-k="left" aria-label="Gauche"><svg viewBox="0 0 10 10"><path d="M1 5 8 .5v9z"/></svg></button>
      <div class="moyeu"></div>
      <button type="button" id="btn-droite" data-k="right" aria-label="Droite"><svg viewBox="0 0 10 10"><path d="M9 5 2 .5v9z"/></svg></button>
      <button type="button" id="btn-bas" data-k="down" aria-label="Descendre"><svg viewBox="0 0 10 10"><path d="M5 9 9.5 2h-9z"/></svg></button>
    </div>
    <div class="actions">
      <div class="action"><button type="button" class="rond" id="btn-ruee" data-k="ruee" aria-label="Ruée (touche C)">C</button><span>RUÉE</span></div>
      <div class="action"><button type="button" class="rond" id="btn-feu" data-k="fire" aria-label="Feu (touche X ou Espace)">X</button><span>FEU</span></div>
    </div>
  </div>
</div>

    if (p < DESCENTE) { const u = p / DESCENTE; return [S_BAS + (1 - S_BAS) * (1 + Math.cos(Math.PI * u)) / 2, 1 + 0.04 * Math.sin(Math.PI * u), -5 * Math.sin(Math.PI * u)]; }
    const u = (p - DESCENTE) / (1 - DESCENTE);
    return [S_BAS + (1 - S_BAS) * (1 - Math.cos(Math.PI * u)) / 2, 1 - 0.14 * Math.sin(Math.PI * u), 7 * Math.sin(Math.PI * u)];
  }
  function poseAile(p) {
    let [s, sx, rot] = profilAile(p.ph);
    const M = 0.35;
    s = M + p.amp * (s - M); sx = 1 + p.amp * (sx - 1); rot *= p.amp;
    s = mix(s, 0.5, p.plane); sx = mix(sx, 1.03, p.plane); rot = mix(rot, -4, p.plane);      // plané : ailes tendues
    s = mix(s, 0.2, p.replie); sx = mix(sx, 0.6, p.replie); rot = mix(rot, 14, p.replie);    // piqué, ruée : repliées
    s = mix(s, 1, p.haut); sx = mix(sx, 1, p.haut); rot = mix(rot, -3, p.haut);              // arrondi avant de se poser
    return { s, sx, rot: rot * Math.PI / 180 };
  }

  // ---------- actions du dragon ----------
  const auSol = () => P.mode === 'ground' || P.mode === 'land';
  function cracher() {
    const vole = P.mode === 'air' || P.mode === 'fall';
    const p = vole ? P.pitch : 0, c = Math.cos(p), s = Math.sin(p);
    const mx = BOUCHE.x, my = BOUCHE.y + (vole ? P.bob : 0);
    const bx = P.x + P.face * (mx * c - my * s), by = P.y + (mx * s + my * c);
    boules.push({ x: bx, y: by, vx: P.face * c * V.BOULE + P.vx * 0.3, vy: s * V.BOULE + P.vy * 0.2, vie: 1.3, trace: [] });
    for (let i = 0; i < 10; i++) particule({ x: bx, y: by, vx: P.face * rand(40, 200), vy: rand(-60, 60), vie: rand(0.15, 0.3), max: 0.3, t: 1 });
    particule({ x: bx + P.face * 3, y: by, vie: 0.07, max: 0.07, genre: 'bouche' });
    P.recul = 1; sfx('feu');
  }
  function demarrerRuee(versLeBas) {
    const depuisLeSol = auSol();
    if (depuisLeSol) { P.mode = 'air'; P.at = 0; P.ph = 0.05; P.amp = 1; P.pitch = -0.2; P.y = GA + AN.land.bodyY[0] - 2; poussiere(P.x, SOL, 8, 1.3); }
    P.ruee = 0; P.rueeCd = 0.55; P.inv = Math.max(P.inv, 0.35); P.atk = -1;
    P.rueeDir = depuisLeSol ? [P.face * 0.94, -0.36] : versLeBas ? [P.face * 0.7, 0.72] : [P.face, 0];
    popup(versLeBas && !depuisLeSol ? 'PIQUÉ !' : 'RUÉE !', P.x, P.y - 34, OS);
    sfx('ruee');
  }
  function blesser(depuisX) {
    if (P.inv > 0 || P.pv <= 0 || etat !== 'jeu') return;
    P.pv--; P.inv = 2.2; P.flash = 0.12; P.atk = -1; P.ruee = -1;
    gel = 0.1; secousse = 0.28; sfx('aie');
    P.vx = Math.sign(P.x - depuisX || -P.face) * 170;
    if (P.pv <= 0) {
      P.mal = -1;
      if (auSol()) { P.mode = 'dead'; P.at = 0; }
      else { P.mode = 'fall'; P.at = 0; P.vy = -70; }
      sfx('chute');
    } else {
      P.mal = 0;
      if (P.mode !== 'air') { P.mode = 'air'; P.at = 0; P.ph = 0; P.pitch = 0; P.y = Math.min(P.y, GA + AN.land.bodyY[0] - 2); }
      P.vy = -80; P.pitchV += Math.random() < 0.5 ? 9 : -9;
    }
  }
  function atterrir() {
    P.impact = P.vy; P.mode = 'land'; P.at = 0; P.vy = 0; P.pitch = 0; P.pitchV = 0;
    const fort = P.impact > 170 || P.ruee >= 0;
    P.ruee = -1;
    poussiere(P.x - P.face * 10, SOL, fort ? 14 : 6, fort ? 1.5 : 0.8);
    if (fort) secousse = Math.max(secousse, 0.14);
    sfx('pose');
  }

  // ---------- mise à jour du dragon ----------
  function majDragon(dt, E) {
    const dir = (E.R ? 1 : 0) - (E.L ? 1 : 0);
    P.at += dt; P.cd -= dt; P.inv -= dt; P.flash -= dt; P.rueeCd -= dt;
    P.recul = Math.max(0, P.recul - dt * 5);
    if (P.mal >= 0) { P.mal += dt; if (P.mal > 0.45) P.mal = -1; }
    if (P.atk >= 0) {
      P.atk += dt;
      if (!P.tire && Math.floor(P.atk * FPS.attack) >= AN.attack.fireFrame) { P.tire = true; cracher(); }
      if (P.atk * FPS.attack >= AN.attack.frames) P.atk = -1;
    }
    const libre = P.mal < 0 && P.pv > 0;
    const enVol = P.mode === 'air';
    if ((E.appuis.has('fire') || E.feu) && libre && P.cd <= 0 && P.atk < 0 && (enVol || P.mode === 'ground')) {
      P.atk = 0; P.tire = false; P.cd = 0.3;
    }
    let ruee = E.appuis.has('ruee');
    if (E.gestes.has('ruee-left')) { ruee = true; P.face = -1; }
    if (E.gestes.has('ruee-right')) { ruee = true; P.face = 1; }
    if (libre && ruee && P.ruee < 0 && P.rueeCd <= 0 && (enVol || auSol())) demarrerRuee(E.D);
    if (libre && dir && P.ruee < 0 && P.atk < 0) P.face = dir;
    P.fs += clamp(P.face - P.fs, -dt * 12, dt * 12);   // demi-tour animé

    switch (P.mode) {
      case 'air': majVol(dt, E, dir, libre); break;
      case 'jump': {        // décollage : les 7 images du modèle, le corps s'élève à partir de la 2e
        if (!P.envol && P.at * FPS.jump >= 1) { P.envol = true; P.vy = -V.SAUT * P.charge; poussiere(P.x, SOL, 10, 1.2); sfx('envol'); }
        if (P.envol) P.vy = approche(P.vy, -40, dt * 3);
        P.vx = approche(P.vx, libre ? dir * V.AIR : 0, dt * 5);
        P.x += P.vx * dt; P.y += P.vy * dt;
        if (P.at * FPS.jump >= AN.jump.frames) {
          P.mode = 'air'; P.at = 0; P.ph = 0; P.amp = 1; P.cad = 2.2; P.pitch = -0.22; P.pitchV = 0;
          P.replie = 0; P.plane = 0; P.haut = 0; P.croisiere = 0;
        }
        break;
      }
      case 'land':
        P.vx = approche(P.vx, 0, dt * 5); P.x += P.vx * dt;
        if (P.at * FPS.land >= AN.land.frames) { P.mode = 'ground'; P.at = 0; }
        break;
      case 'ground': {
        const accroupi = libre && E.D && P.atk < 0;
        P.accroupi = accroupi ? P.accroupi + dt : Math.max(0, P.accroupi - dt * 2);
        if (libre && E.U && P.atk < 0) {
          P.charge = P.accroupi > 0.25 ? 1.3 : 1;
          if (P.charge > 1) popup('SUPER SAUT !', P.x, P.y - 34, OS);
          P.mode = 'jump'; P.at = 0; P.envol = false; P.accroupi = 0;
          P.y = GA + AN.jump.bodyY[0];
          break;
        }
        P.course = dir && !accroupi && P.atk < 0 ? P.course + dt : 0;
        const vitesse = mix(V.MARCHE, V.COURSE, clamp((P.course - 0.35) / 0.7, 0, 1));
        P.vx = approche(P.vx, libre && !accroupi && P.atk < 0 ? dir * vitesse : 0, dt * 8);
        P.x += P.vx * dt;
        const avant = Math.floor(P.pas);
        P.pas += dt * FPS.walk * Math.abs(P.vx) / V.MARCHE;
        if (Math.floor(P.pas) !== avant && Math.floor(P.pas) % AN.walk.frames === 3 && Math.abs(P.vx) > V.MARCHE * 1.2) poussiere(P.x - P.face * 26, SOL, 2, 0.5);
        break;
      }
      case 'fall': {
        P.vy += 620 * dt; P.vx = approche(P.vx, 0, dt);
        P.x += P.vx * dt; P.y += P.vy * dt;
        P.amp = approche(P.amp, 0.45, dt * 3); P.cad = 3.2; P.replie = approche(P.replie, 0.35, dt * 3);
        P.ph += P.cad * dt;
        P.pitchV += (40 * (0.9 - P.pitch) - 6 * P.pitchV) * dt; P.pitch += P.pitchV * dt;
        ressortQueue(dt, 0.2);
        if (P.y >= GA + AN.dead.bodyY[0]) { P.mode = 'dead'; P.at = 0; P.pitch = 0; secousse = 0.25; poussiere(P.x, SOL, 16, 1.4); sfx('pose'); }
        break;
      }
      case 'dead':
        P.vx = approche(P.vx, 0, dt * 6); P.x += P.vx * dt;
        if (etat === 'jeu' && P.at * FPS.dead >= AN.dead.frames + 5) { etat = 'fin'; finT = 0; }
        break;
    }
    if (P.mode === 'ground' || P.mode === 'land' || P.mode === 'dead') {   // au sol, le corps suit l'image
      const d = posture();
      P.y = AN[d.an].grounded ? GA + AN[d.an].bodyY[d.i] : GA;
    }
    // bornes : pas de retour vers l'acte précédent ; l'arène du Veilleur est close
    if (etat === 'jeu') {
      const gauche = arene ? ARENE + 14 : ACTES[acte].debut + 14;
      if (P.x < gauche) { P.x = gauche; P.vx = Math.max(0, P.vx); }
      if (arene && P.x > ARENE + W * 0.45) { P.x = ARENE + W * 0.45; P.vx = Math.min(0, P.vx); }   // on fait face au Veilleur
    }
  }
  function ressortQueue(dt, cible) {
    P.queueV += (80 * (cible - P.queue) - 9 * P.queueV) * dt;
    P.queue += P.queueV * dt;
  }
  function majVol(dt, E, dir, libre) {
    let cAmp = 1, cCad = 1.15, cPlane = 0, cReplie = 0;
    P.elan = Math.max(0, P.elan - dt);
    if (P.ruee >= 0) {
      P.ruee += dt;
      const u = P.ruee / 0.3, v = V.RUEE * (1 - 0.45 * u * u);
      P.vx = P.rueeDir[0] * v; P.vy = P.rueeDir[1] * v;
      cAmp = 0.1; cCad = 0.6; cReplie = 1;
      if (u >= 1) { P.ruee = -1; P.vx = P.face * V.AIR * 1.1; P.vy *= 0.3; }
    } else {
      const pique = libre && E.D && P.elan <= 0, monte = libre && (E.U || P.elan > 0);
      P.vx = approche(P.vx, libre ? dir * V.AIR : 0, dt * 4);
      P.vy = approche(P.vy, pique ? V.PIQUE : monte ? -V.VERT * (P.elan > 0 ? 1.6 : 1) : 0, dt * (pique ? 2.5 : 5));
      if (P.mal >= 0) cCad = 3.2;
      else if (pique) { cAmp = 0.15; cCad = 0.8; cReplie = clamp((P.vy - 50) / 140, 0, 0.9); }
      else if (monte) cCad = 2.3;
      else if (Math.abs(P.vx) > V.AIR * 0.6) {
        P.croisiere += dt;
        const bat = P.croisiere % 2.6 < 1.5;          // en croisière : quelques battements, puis on plane
        cAmp = bat ? 0.85 : 0.12; cCad = bat ? 1.7 : 0.7; cPlane = bat ? 0 : 1;
      } else P.croisiere = 0;
    }
    P.x += P.vx * dt; P.y += P.vy * dt;
    if (P.y < PLAFOND + 18) { P.y = PLAFOND + 18; P.vy = Math.max(0, P.vy); }
    // arrondi avant de toucher le sol (ailes levées, nez relevé), puis atterrissage
    const arrondi = P.vy > 0 && P.y > GA + AN.land.bodyY[0] - Math.max(18, P.vy * 0.24);
    P.haut = approche(P.haut, arrondi ? 1 : 0, dt * (arrondi ? 10 : 6));
    if (arrondi) { cReplie = 0; cAmp = 0.3; }
    const cPitch = clamp(clamp(P.vy / V.VERT, -1.4, 1.9) * 0.18 + clamp(P.vx * P.face / V.AIR, -1, 1) * 0.04
      - P.recul * 0.12 - (arrondi ? 0.14 : 0) + (P.ruee >= 0 ? 0.08 : 0), -0.26, 0.32);
    P.pitchV += (55 * (cPitch - P.pitch) - 10 * P.pitchV) * dt; P.pitch += P.pitchV * dt;
    P.amp = approche(P.amp, cAmp, dt * 5); P.cad = approche(P.cad, cCad, dt * 4);
    P.plane = approche(P.plane, cPlane, dt * 3); P.replie = approche(P.replie, cReplie, dt * (P.ruee >= 0 ? 16 : 6));
    const avant = frac(P.ph);
    P.ph += P.cad * dt;
    if (avant > 0.9 && frac(P.ph) < 0.1 && P.amp > 0.6) sfx('battement');
    P.bob = -1.3 * P.amp * Math.sin(2 * Math.PI * (frac(P.ph) - 0.2));
    ressortQueue(dt, P.amp * 0.09 * Math.sin(2 * Math.PI * P.ph - 1.3) + clamp(P.vy / V.VERT, -1.5, 1.8) * 0.1
      + (P.ruee >= 0 ? 0.14 : 0) - P.pitchV * 0.03);
    const seuil = GA + AN.land.bodyY[0];
    if (P.y >= seuil) {
      if (P.vy > 15 && P.mal < 0 && P.pv > 0) atterrir();
      else { P.y = seuil; P.vy = Math.min(P.vy, 0); }
    }
    P.ombreT -= dt;
    if (P.ruee >= 0 && P.ombreT <= 0) { P.ombreT = 0.028; ombres.push({ d: posture(), vie: 0.2 }); }
  }

  // ---------- posture : ce qui décrit l'image du dragon à dessiner ----------
  // en vol : la marionnette, calculée en continu ; au sol : les images du modèle, redessinées par Pixel Artist
  function posture() {
    const unique = (a, t, fps) => Math.min(Math.floor(t * fps), AN[a].frames - 1);
    const cadre = (an, i, y) => ({ type: 'planche', an, i, x: P.x, y, fs: P.fs });
    switch (P.mode) {
      case 'air': case 'fall': {
        const ph = frac(P.ph);
        return { type: 'rig', pose: 'vol', x: P.x, y: P.y, fs: P.fs, pitch: P.pitch, corps: { dx: -P.recul * 3, dy: P.bob },
                 aile: poseAile(P), queue: P.queue, tete: { dx: 0, dy: -0.6 * P.amp * Math.sin(2 * Math.PI * (ph - 0.35)), rot: 0 },
                 teteVariante: P.atk >= 0 ? unique('attack', P.atk, FPS.attack) : -1,
                 cavalier: { dy: 0.7 * P.amp * Math.sin(2 * Math.PI * (ph - 0.05)), rot: P.ruee >= 0 ? 0.3 : clamp(P.vy / V.PIQUE, 0, 1) * 0.2 } };
      }
      case 'jump': { const i = unique('jump', P.at, FPS.jump); return cadre('jump', i, P.y - AN.jump.bodyY[i]); }
      case 'land': return cadre('land', unique('land', P.at, FPS.land), GA);
      case 'dead': return cadre('dead', unique('dead', P.at, FPS.dead), GA);
      default:
        if (P.atk >= 0) return cadre('attack', unique('attack', P.atk, FPS.attack), GA);
        if (P.accroupi > 0.05 && tenuBas) return cadre('jump', 0, GA);
        if (Math.abs(P.vx) > 12) return cadre('walk', Math.floor(P.pas) % AN.walk.frames, GA);
        return cadre('land', AN.land.frames - 1, GA);
    }
  }
  function autour(q, rot, dx = 0, dy = 0) { ctx.translate(q.p[0] + dx, q.p[1] + dy); ctx.rotate(rot); ctx.translate(-q.p[0], -q.p[1]); }
  function transformer(q, d, loin) {
    switch (q.role) {
      case 'aile': {
        const w = d.aile, [qx, qy] = q.a || [q.p[0] - 10, q.p[1]], b = Math.atan2(q.p[1] - qy, q.p[0] - qx);
        ctx.translate(q.p[0], q.p[1]); ctx.rotate(b + w.rot);
        ctx.scale(w.sx * (loin ? LOIN.sx : 1), w.s * (loin ? LOIN.s : 1));
        ctx.rotate(-b); ctx.translate(-q.p[0], -q.p[1]);
        break;
      }
      case 'tete': autour(q, d.tete.rot, Math.round(d.tete.dx), Math.round(d.tete.dy)); break;
      case 'queue': autour(q, d.queue); break;
      case 'cavalier': autour(q, d.cavalier.rot, 0, Math.round(d.cavalier.dy)); break;
    }
  }
  function dessinerPosture(d, jeu) {
    if (d.type === 'planche') {
      ctx.save();
      ctx.translate(Math.round(d.x - cam), Math.round(d.y));
      ctx.scale(largeurDemiTour(d.fs), 1);
      ctx.drawImage(PL[jeu], d.i * FW, AN[d.an].row * FH, FW, FH, -Math.round(AX), -Math.round(AY), FW, FH);
      ctx.restore();
      return;
    }
    const L = PIECES[jeu][d.pose], tete = L.find((q) => q.role === 'tete');
    ctx.save();
    ctx.translate(Math.round(d.x - cam), Math.round(d.y));
    ctx.scale(largeurDemiTour(d.fs), 1);
    if (d.pitch) ctx.rotate(d.pitch);
    ctx.translate(Math.round(d.corps.dx), Math.round(d.corps.dy));
    for (const q of L) if (q.double) {                  // l'aile opposée, plus sombre, derrière tout
      ctx.save(); ctx.translate(LOIN.dx, LOIN.dy); transformer(q, d, true); ctx.drawImage(q.loin, q.o[0], q.o[1]); ctx.restore();
    }
    for (const q of L) {
      ctx.save();
      if (q.parent === 'tete' && tete) transformer(tete, d, false);
      transformer(q, d, false);
      const v = q.role === 'tete' && d.teteVariante >= 0 && q.variantes[d.teteVariante];
      if (v) ctx.drawImage(v.img, v.o[0], v.o[1]);                      // la vraie tête d'attaque, gueule ouverte
      else ctx.drawImage(q.role === 'aile' && d.aile.s < 0 ? q.dessous : q.img, q.o[0], q.o[1]);
      ctx.restore();
    }
    ctx.restore();
  }
  const largeurDemiTour = (fs) => (fs < 0 ? -1 : 1) * (0.3 + 0.7 * Math.abs(fs));
  function dessinerDragon() {
    const d = posture();
    const haut = clamp((SOL - P.y) / (SOL - PLAFOND), 0, 1);
    const lo = Math.round(46 * (1 - haut * 0.6));
    ctx.fillStyle = '#050407';
    for (let y = 0; y < 3; y++) {
      const w = Math.round(lo * Math.sqrt(Math.max(0, 1 - ((y - 1) / 1.6) ** 2)));
      ctx.fillRect(Math.round(P.x - cam + P.fs * 6) - w, SOL + 1 + y, w * 2, 1);
    }
    for (const o of ombres) { ctx.globalAlpha = 0.5 * o.vie / 0.2; dessinerPosture(o.d, 'fantome'); }
    ctx.globalAlpha = 1;
    const clignote = P.inv > 0 && P.pv > 0 && P.ruee < 0 && P.mal < 0 && Math.floor(temps * 30) % 2;
    if (clignote) return;
    if (P.flash > 0) { dessinerPosture(d, 'blanc'); return; }
    // liseré clair : le dragon noir reste lisible sur la nuit
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { ctx.save(); ctx.translate(dx, dy); dessinerPosture(d, 'contour'); ctx.restore(); }
    dessinerPosture(d, 'normal');
    if (reperes) {
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(Math.round(P.x - cam) - 4, Math.round(P.y), 9, 1); ctx.fillRect(Math.round(P.x - cam), Math.round(P.y) - 4, 1, 9);
      ctx.fillStyle = '#3bffb0';
      for (let a = 0; a < 6.28; a += 0.12) ctx.fillRect(Math.round(P.x - cam + P.face * 6 + Math.cos(a) * 34), Math.round(P.y + 4 + Math.sin(a) * 12), 1, 1);
      texte(`${P.mode} · ${d.type === 'rig' ? 'marionnette' : d.an + ' ' + (d.i + 1)}`.toUpperCase(), 6, H - 12, '#9fb4c8');
    }
  }

  // ================= Ennemis =================
  const TYPES = {
    charognard: { pv: 1, r: 7, pts: 100 },
    ame: { pv: 1, r: 6, pts: 80 },
    chauve: { pv: 1, r: 6, pts: 120 },
    spectre: { pv: 2, r: 8, pts: 200 },
    crane: { pv: 2, r: 7, pts: 150 },
  };
  function creerEnnemi(type, x, y, dir, diff) {
    const e = { type, x, y, cy: y, t: rand(0, 3), ph: rand(0, 6.28), pv: TYPES[type].pv, flash: 0, vx: 0, vy: 0, visible: true };
    if (type === 'charognard') { e.vx = dir * rand(38, 58) * diff; e.amp = rand(4, 12); }
    else if (type === 'ame') { e.vx = dir * rand(18, 30) * diff; e.amp = rand(10, 22); }
    else if (type === 'chauve') { e.vx = dir * rand(48, 66) * diff; e.chg = 0; }
    else if (type === 'spectre') e.vx = dir * 20 * diff;
    else if (type === 'crane') { const a = Math.atan2(P.y - y, P.x - x), v = 70 * diff; e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v; }
    return e;
  }
  function majEnnemi(e, dt) {
    e.t += dt; e.flash -= dt;
    switch (e.type) {
      case 'charognard': e.x += e.vx * dt; e.cy = approche(e.cy, P.y, dt * 0.12); e.y = e.cy + Math.sin(e.t * 2.3 + e.ph) * e.amp; break;
      case 'ame':
        e.x += e.vx * dt; e.y = e.cy + Math.sin(e.t * 1.3 + e.ph) * e.amp;
        if (Math.random() < 0.3) particule({ x: e.x + rand(-2, 2), y: e.y - 4, vx: rand(-6, 6), vy: rand(-22, -10), vie: 0.5, max: 0.5, t: 1, genre: 'ecto' });
        break;
      case 'chauve':
        e.chg -= dt;
        if (e.chg <= 0) { e.chg = rand(0.25, 0.5); e.vy = clamp((P.y - e.y) * 0.35 + rand(-50, 50), -60, 60); }
        e.x += e.vx * dt; e.y += e.vy * dt;
        break;
      case 'spectre': {
        e.visible = e.t % 3.4 < 2.2;
        const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
        e.x += (dx / d * 18 + e.vx * 0.3) * dt; e.y += (dy / d * 14 + Math.sin(e.t * 2) * 6) * dt;
        break;
      }
      case 'crane':
        e.x += e.vx * dt; e.y += e.vy * dt;
        if (Math.random() < 0.6) particule({ x: e.x - Math.sign(e.vx) * 5, y: e.y + rand(-2, 2), vx: -e.vx * 0.2 + rand(-10, 10), vy: rand(-20, 5), vie: 0.3, max: 0.3, t: 1 });
        break;
    }
    e.y = clamp(e.y, PLAFOND - 6, SOL - 14);
  }
  function apparitions(dt) {
    if (carte || arene || CALME || P.pv <= 0) return;
    prochain -= dt;
    if (prochain > 0) return;
    const A = ACTES[acte], diff = 1 + (cycle - 1) * 0.25;
    prochain = A.intervalle / diff * rand(0.8, 1.2);
    if (ennemis.length >= A.max) return;
    const type = A.types[Math.floor(Math.random() * A.types.length)];
    const droite = Math.random() < 0.72, dir = droite ? -1 : 1;
    const nb = type === 'chauve' ? 3 : type === 'charognard' && Math.random() < 0.3 ? 2 : 1;
    const y0 = rand(PLAFOND + 16, SOL - 42);
    for (let n = 0; n < nb; n++) {
      const x = cam + (droite ? W + 24 + n * 18 : -24 - n * 18);
      ennemis.push(creerEnnemi(type, x, clamp(y0 + (n - 1) * 14, PLAFOND + 10, SOL - 28), dir, diff));
    }
  }
  function tuer(e) {
    explosion(e.x, e.y, e.type === 'crane' || e.type === 'spectre');
    if (etat !== 'jeu') return;
    combo = temps - dernierKill < 1.4 ? Math.min(combo + 1, 9) : 1;
    dernierKill = temps;
    const pts = TYPES[e.type].pts * combo;
    score += pts; gel = Math.max(gel, 0.04);
    popup('+' + pts, e.x, e.y - 10, combo > 1 ? '#e0c080' : OS);
    if (combo > 1) { popup('COMBO ×' + combo, e.x, e.y - 22, FEU[2]); sfx('combo'); }
    if (P.pv < PV_MAX && Math.random() < (arene ? 0.4 : 0.2)) coeurs.push({ x: e.x, y: e.y, t: 0 });
    if (score > record) { record = score; try { localStorage.setItem('dragon-rider-record', record); } catch {} }
  }

  // ---------- le Veilleur, au fond des cryptes ----------
  function entrerArene() {
    arene = true; ennemis = [];
    veilleur = { x: ARENE + W * 0.76, y: SOL + 70, pv: 22, pvMax: 22, t: 0, entree: 0, tir: 3, invoc: 9, flash: 0, machoire: 0, mort: -1, boum: 0 };
    carte = { titre: 'LE VEILLEUR', nom: '', sous: "IL N'A JAMAIS DORMI.", t: 0, fondu: false };
    sfx('veilleur');
  }
  function eventail(v, n, ecart) {
    const bx = v.x - 6, by = v.y + 18, a0 = Math.atan2(P.y - by, P.x - bx);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i - (n - 1) / 2) * ecart / (n - 1);
      orbes.push({ x: bx, y: by, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, vie: 8 });
    }
    sfx('orbe');
  }
  function blesserVeilleur(v, n) {
    if (v.mort >= 0 || v.entree < 2) return;
    v.pv -= n; v.flash = 0.08; sfx('touche');
    if (v.pv <= 0) {
      v.mort = 0; orbes = []; secousse = 0.6; sfx('veilleur');
      ennemis.forEach((e) => explosion(e.x, e.y, true)); ennemis = [];
      score += 5000 * cycle; popup('+' + 5000 * cycle, v.x, v.y - 40, '#e0c080', 2);
      if (score > record) { record = score; try { localStorage.setItem('dragon-rider-record', record); } catch {} }
    }
  }
  function majVeilleur(dt) {
    const v = veilleur;
    if (!v) return;
    v.t += dt; v.flash -= dt;
    const haut = PLAFOND + 34, bas = SOL - 64, milieu = (haut + bas) / 2;
    if (v.mort >= 0) {
      v.mort += dt; v.boum -= dt; v.y += 10 * dt;
      if (v.boum <= 0) { v.boum = 0.12; explosion(v.x + rand(-26, 26), v.y + rand(-22, 26), true); secousse = 0.3; }
      if (v.mort > 2.6) { etat = 'epilogue'; epiT = 0; veilleur = null; }
      return;
    }
    if (v.entree < 2) { v.entree += dt; v.y = approche(v.y, milieu, dt * 1.6); v.machoire = v.entree < 1.6 ? 0.5 + 0.5 * Math.sin(v.t * 9) : 0; return; }
    const rage = v.pv < v.pvMax / 2, diff = 1 + (cycle - 1) * 0.2;
    v.x = ARENE + W * (0.74 + 0.07 * Math.sin(v.t * 0.55));
    v.y = milieu + Math.sin(v.t * (rage ? 1.05 : 0.75)) * (bas - haut) * 0.45;
    v.tir -= dt * diff; v.invoc -= dt;
    v.machoire = approche(v.machoire, v.tir < 0.35 ? 1 : 0, dt * 10);
    if (v.tir <= 0) { v.tir = rage ? 2.5 : 3.2; eventail(v, rage ? 6 : 5, rage ? 1.1 : 0.9); }
    if (v.invoc <= 0) {
      v.invoc = rage ? 8 : 10;
      if (ennemis.length < 4) for (const k of [-1, 1]) ennemis.push(creerEnnemi('chauve', v.x - 10, v.y + k * 18, -1, 1));
    }
    const d = Math.hypot(P.x - v.x, P.y + 4 - v.y);
    if (d < 28 && P.pv > 0) {
      if (P.ruee >= 0) { blesserVeilleur(v, 2); P.ruee = -1; P.vx = -P.face * 250; P.inv = Math.max(P.inv, 0.6); }
      else blesser(v.x);
    }
  }

  // ================= Le monde : ennemis, boules de feu, orbes, cœurs, particules =================
  function majMonde(dt) {
    apparitions(dt);
    for (const e of ennemis) majEnnemi(e, dt);
    ennemis = ennemis.filter((e) => Math.abs(e.x - (cam + W / 2)) < W + 220);
    majVeilleur(dt);

    for (const b of boules) {
      b.vie -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
      b.trace.unshift([b.x, b.y]); if (b.trace.length > 7) b.trace.pop();
      if (Math.random() < 0.6) particule({ x: b.x, y: b.y, vx: -b.vx * 0.15 + rand(-20, 20), vy: -b.vy * 0.15 + rand(-25, 25), vie: rand(0.12, 0.3), max: 0.3, t: 1 });
      if (b.y > SOL) { b.vie = 0; explosionSol(b.x); continue; }
      for (const e of ennemis) {
        if (e.mort || !e.visible || Math.hypot(e.x - b.x, e.y - b.y) > TYPES[e.type].r + 8) continue;
        b.vie = 0; e.pv--; e.flash = 0.08;
        if (e.pv <= 0) { e.mort = true; tuer(e); } else sfx('touche');
        break;
      }
      for (const o of orbes) if (b.vie > 0 && Math.hypot(o.x - b.x, o.y - b.y) < 10) { o.vie = 0; b.vie = 0; explosionSol(o.x); }
      if (veilleur && b.vie > 0 && Math.hypot(veilleur.x - b.x, veilleur.y - b.y) < 28) { b.vie = 0; blesserVeilleur(veilleur, 1); explosionSol(b.x); }
    }
    boules = boules.filter((b) => b.vie > 0);

    // collisions avec le dragon (zone réduite au corps, plus indulgente que le sprite)
    const hx = P.x + P.face * 6, hy = P.y + 4, fonce = P.ruee >= 0;
    const touche = (x, y, r) => { const dx = (x - hx) / (34 + r), dy = (y - hy) / (12 + r); return dx * dx + dy * dy < 1; };
    for (const e of ennemis) {
      if (e.mort || !e.visible || P.pv <= 0 || !touche(e.x, e.y, TYPES[e.type].r)) continue;
      if (fonce) { e.mort = true; tuer(e); }
      else if (P.inv <= 0) { blesser(e.x); e.mort = true; explosion(e.x, e.y, false); }
    }
    ennemis = ennemis.filter((e) => !e.mort);
    for (const o of orbes) {
      o.vie -= dt; o.x += o.vx * dt; o.y += o.vy * dt;
      if (P.pv > 0 && touche(o.x, o.y, 3) && P.ruee < 0) { o.vie = 0; blesser(o.x); }
    }
    orbes = orbes.filter((o) => o.vie > 0 && o.y > PLAFOND - 20 && o.y < SOL + 10 && Math.abs(o.x - cam - W / 2) < W);
    for (const c of coeurs) {
      c.t += dt; c.y = Math.min(SOL - 8, c.y + 14 * dt);
      if (P.pv > 0 && Math.hypot(c.x - P.x, c.y - P.y - 4) < 24) { c.pris = true; P.pv = Math.min(PV_MAX, P.pv + 1); popup('VIE +1', c.x, c.y - 10, '#e0505a'); sfx('soin'); }
    }
    coeurs = coeurs.filter((c) => !c.pris && c.t < 9);

    for (const p of particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.genre === 'plume' || p.genre === 'os') { p.vy += 200 * dt; p.vx *= 0.97; p.rot += dt * 7; }
      else if (p.genre === 'poussiere') { p.vx *= 0.9; p.vy *= 0.92; }
      else { p.vx *= 0.93; p.vy *= 0.93; }
    }
    particules = particules.filter((p) => p.vie > 0);
    for (const o of ombres) o.vie -= dt;
    ombres = ombres.filter((o) => o.vie > 0);
    for (const p of popups) { p.vie -= dt; p.y -= 22 * dt; }
    popups = popups.filter((p) => p.vie > 0);
  }
  function explosionSol(x) {
    particule({ x, y: SOL - 2, vie: 0.25, max: 0.25, genre: 'onde' });
    for (let i = 0; i < 8; i++) particule({ x, y: SOL - 1, vx: rand(-70, 70), vy: rand(-90, -20), vie: rand(0.2, 0.45), max: 0.45, t: Math.floor(rand(1, 3)) });
  }

  // ---------- dessin des ennemis, du Veilleur et des effets ----------
  const COEUR = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  function coeur(x, y, plein) {
    COEUR.forEach((l, r) => [...l].forEach((c, k) => {
      if (c !== 'X') return;
      ctx.fillStyle = plein ? (r === 1 && k < 3 ? '#e07078' : SANG_VIF) : '#2e2439';
      ctx.fillRect(x + k, y + r, 1, 1);
    }));
  }
  function dessinerEnnemis() {
    for (const c of coeurs) if (c.t < 7 || Math.floor(temps * 12) % 2) coeur(Math.round(c.x - cam) - 3, Math.round(c.y + Math.sin(c.t * 4) * 2) - 3, true);
    for (const e of ennemis) {
      const x = Math.round(e.x - cam), y = Math.round(e.y);
      if (e.type === 'ame') {
        const f = Math.sin(e.t * 9) > 0;
        ctx.globalAlpha = 0.85;
        disque(x, y, 5, e.flash > 0 ? '#ffffff' : '#3e3549'); disque(x, y - 1, 3, BRUME); disque(x, y - 2, f ? 2 : 1, '#e6e0dc');
        ctx.fillStyle = BRUME; ctx.fillRect(x - 1, y - 8 - (f ? 1 : 0), 2, 3);
        ctx.globalAlpha = 1;
        continue;
      }
      const nom = e.type === 'charognard' ? 'corbeau' : e.type;
      const frames = SPR[nom];
      const f = frames.length === 3 ? [0, 1, 2, 1][Math.floor(e.t * 12) % 4] : Math.floor(e.t * 4) % frames.length;
      const img = e.flash > 0 ? frames[f].b : frames[f].n;
      if (e.type === 'spectre') ctx.globalAlpha = e.visible ? 0.72 : 0.1;
      ctx.save(); ctx.translate(x, y);
      if (e.vx < 0 && e.type !== 'spectre') ctx.scale(-1, 1);
      ctx.drawImage(img, -Math.floor(img.width / 2), -Math.floor(img.height / 2));
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    const v = veilleur;
    if (v) {
      const x = Math.round(v.x - cam), y = Math.round(v.y);
      if (!(v.mort >= 0 && Math.floor(temps * 20) % 2)) {
        if (Math.random() < 0.5) particule({ x: v.x + rand(-24, 24), y: v.y + rand(-10, 20), vx: rand(-5, 5), vy: rand(-30, -12), vie: 0.8, max: 0.8, t: 1, genre: 'ecto' });
        const blanc = v.flash > 0;
        const M = blanc ? MACHOIRE_IMG.b : MACHOIRE_IMG.n, S = blanc ? VEILLEUR_IMG.b : VEILLEUR_IMG.n;
        ctx.drawImage(M, x - (M.width >> 1), y + 18 + Math.round(v.machoire * 8));
        ctx.drawImage(S, x - (S.width >> 1), y - (S.height >> 1));
        const lueur = 0.5 + 0.5 * Math.sin(temps * 7);
        for (const ex of [-10, 10]) { disque(x + ex, y + 1, 3, SANG); disque(x + ex, y + 1, 2, SANG_VIF); ctx.fillStyle = lueur > 0.5 ? '#ffb09a' : '#ff6a3a'; ctx.fillRect(x + ex, y + 1, 1, 1); }
      }
    }
  }
  function dessinerEffets() {
    for (const b of boules) {
      b.trace.forEach(([tx, ty], k) => { if (k) disque(tx - cam, ty, Math.max(1, 5 - k), FEU[Math.min(6, 2 + k)]); });
      const x = b.x - cam, f = Math.floor(temps * 20) % 2;
      disque(x, b.y, 7 + f, FEU[4]); disque(x, b.y, 5 + f, FEU[2]); disque(x, b.y, 3, FEU[0]);
    }
    for (const o of orbes) {
      const x = o.x - cam, f = Math.floor(temps * 12) % 2;
      disque(x, o.y, 5, ENCRE); disque(x, o.y, 4, SANG); disque(x, o.y, 2 + f, SANG_VIF); ctx.fillStyle = '#ffb09a'; ctx.fillRect(Math.round(x), Math.round(o.y), 1, 1);
    }
    for (const p of particules) {
      const x = Math.round(p.x - cam), y = Math.round(p.y), k = clamp(p.vie / p.max, 0, 1);
      if (p.genre === 'braise') { ctx.fillStyle = FEU[Math.min(6, Math.floor((1 - k) * 7))]; ctx.fillRect(x, y, p.t, p.t); }
      else if (p.genre === 'plume' || p.genre === 'os') {
        ctx.fillStyle = p.genre === 'os' ? (k > 0.3 ? OS2 : CENDRE) : (k > 0.3 ? '#3a2d45' : '#5a4656');
        const l = Math.cos(p.rot) > 0 ? 3 : 1;
        ctx.fillRect(x - l, y, l * 2, 1); ctx.fillRect(x, y - 1, 1, 1);
      } else if (p.genre === 'ecto') { ctx.fillStyle = k > 0.5 ? BRUME : '#3e3549'; ctx.fillRect(x, y, 1, 1); }
      else if (p.genre === 'poussiere') disque(x, y, Math.round(p.t + (1 - k) * 3), k > 0.5 ? '#5a4f5f' : '#3a3044');
      else if (p.genre === 'eclair') disque(x, y, 9, '#ffffff');
      else if (p.genre === 'bouche') { disque(x, y, 5, FEU[3]); disque(x, y, 3, FEU[1]); disque(x, y, 1, FEU[0]); }
      else if (p.genre === 'onde') {
        const r = Math.round(4 + (1 - k) * 16);
        ctx.fillStyle = k > 0.5 ? FEU[0] : FEU[2];
        for (let a = 0; a < 6.28; a += 1 / r) ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), 1, 1);
      }
    }
    for (const p of popups) if (p.vie > 0.25 || Math.floor(temps * 20) % 2) texte(p.txt, p.x - cam, p.y, p.teinte, p.k, 'ombre', 'centre');
  }

  // ================= Interface (dessinée dans l'image, en police pixel) =================
  function hautParleur(x, y) {
    ctx.fillStyle = OS;
    ctx.fillRect(x, y + 2, 2, 3); ctx.fillRect(x + 2, y + 1, 1, 5); ctx.fillRect(x + 3, y, 1, 7);
    if (muet) { ctx.fillStyle = SANG_VIF; for (let i = 0; i < 5; i++) { ctx.fillRect(x + 5 + i, y + 1 + i, 1, 1); ctx.fillRect(x + 9 - i, y + 1 + i, 1, 1); } }
    else { ctx.fillRect(x + 5, y + 2, 1, 3); ctx.fillRect(x + 7, y + 1, 1, 5); }
  }
  function barre(x, y, w, f, c) {
    ctx.fillStyle = ENCRE; ctx.fillRect(x - 1, y - 1, w + 2, 5);
    ctx.fillStyle = '#2e2439'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = c; ctx.fillRect(x, y, Math.round(w * clamp(f, 0, 1)), 3);
  }
  function hud() {

    }
  }
  function dessinerCarte() {

      texte(carte.sous, W / 2, y + 22, OS2, 1, 'ombre', 'centre');
    }
  }
  function ecranTitre() {
    const k = W >= 310 ? 4 : 3, y = Math.max(20, H * 0.1);
    texte('DRAGON RIDER', W / 2, y, LOGO, k, 'contour', 'centre');

  function ecranFin(dt) {
    finT += dt;
    ctx.fillStyle = 'rgba(7,6,11,0.55)'; ctx.fillRect(0, 0, W, H);
    const y = Math.round(H * 0.3);
    texte('LE DRAGONNIER EST TOMBÉ', W / 2, y, LOGO, W >= 290 ? 2 : 1, 'contour', 'centre');
    texte('SCORE ' + pad(score, 6) + '   RECORD ' + pad(record, 6), W / 2, y + 30, OS2, 1, 'ombre', 'centre');
    if (Math.floor(temps * 2) % 2) texte(arene ? 'FEU : AFFRONTER DE NOUVEAU LE VEILLEUR' : "FEU : REPRENDRE L'ACTE " + ACTES[acte].num, W / 2, y + 50, OS, 1, 'contour', 'centre');
  }
  function ecranEpilogue() {
    ctx.fillStyle = ENCRE; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { const x = Math.floor(hash(i * 3.3) * W), y = Math.floor(hash(i * 5.1) * H); if (Math.sin(temps + i) > 0.3) { ctx.fillStyle = '#2e2439'; ctx.fillRect(x, y, 1, 1); } }
    EPILOGUE.forEach((l, i) => { if (epiT > 0.8 + i * 1.5) texte(l, W / 2, Math.round(H * 0.24) + i * 16, i === 3 ? OS : BRUME, 1, 'ombre', 'centre'); });
    if (epiT > 7) {
      texte('SCORE ' + pad(score, 6) + '   RECORD ' + pad(record, 6), W / 2, Math.round(H * 0.24) + 82, OS2, 1, 'ombre', 'centre');

  // ================= Démo de l'écran titre (le dragon vole tout seul) =================
  let demoAvant = 0;
  function entreesDemo() {
    const E = { L: false, R: true, U: false, D: false, feu: false, appuis: new Set(), gestes: new Set() };
    const c0 = demoAvant % 7, c1 = temps % 7;
    demoAvant = temps;
    const passe = (t) => c0 < t && c1 >= t;
    E.U = P.y > HORIZON - 16 || (c1 > 1 && c1 < 1.6);
    E.D = P.y < PLAFOND + 40 && !E.U;
    if (passe(0.5) || passe(2.2) || passe(4.6) || passe(6.3)) E.appuis.add('fire');
    if (passe(5.5)) E.appuis.add('ruee');
    return E;
  }

  // ================= Boucle =================
  let avant = 0;
  function boucle(tms) {
    const dt = Math.min(0.05, (tms - avant) / 1000 || 0);
    avant = tms;
    temps += dt;
    if (etat === 'epilogue') {
      epiT += dt;
      if (epiT > 7 && appuis.has('fire')) nouveauCycle();
      appuis = new Set(); gestes = new Set();
      if (etat === 'epilogue') { ecranEpilogue(); requestAnimationFrame(boucle); return; }
    }
    const E = etat === 'titre' ? entreesDemo()
      : { L: tenu('left'), R: tenu('right'), U: tenu('up'), D: tenu('down'), feu: tenu('fire'), appuis, gestes };
    tenuBas = E.D;
    if (etat === 'titre' && (appuis.has('fire') || appuis.has('ruee'))) nouvellePartie();
    else if (etat === 'fin' && finT > 0.8 && appuis.has('fire')) reprendre();
    else if (gel > 0) gel -= dt;                                   // micro-pause à l'impact
    else {
      if (etat === 'titre') P.pv = PV_MAX;
      majCarte(dt);
      majDragon(dt, E);
      if (etat === 'jeu') progression();
      majMonde(dt);
      majMeteo(dt);
      const borne = etat === 'titre' ? -1e9 : arene ? ARENE : ACTES[acte].debut - 8;
      const cible = arene ? ARENE : P.x - W * 0.38 + P.face * W * 0.08;
      cam = Math.max(borne, approche(cam, cible, dt * 3));
    }
    appuis = new Set(); gestes = new Set();
    secousse = Math.max(0, secousse - dt);

    ctx.save();
    if (secousse > 0 && !reduit) ctx.translate(Math.round(rand(-2, 2) * secousse * 5), Math.round(rand(-2, 2) * secousse * 5));
    decor();
    dessinerEnnemis();
    dessinerDragon();
    dessinerEffets();
    premierPlan();
    dessinerMeteo();
    ctx.restore();
    ctx.drawImage(VIGNETTES[DECORS[acteVisuel].exterieur ? 0 : 1], 0, 0);
    if (etat === 'titre') ecranTitre();
    else { hud(); dessinerCarte(); if (etat === 'fin') ecranFin(dt); }
    if (etat === 'epilogue') ecranEpilogue();
    requestAnimationFrame(boucle);
  }

  // lecture seule, pour les tests automatisés (outils de vérification)
  window.__dragonRider = () => {
    return { etat, acte: acte + 1, decor: acteVisuel + 1, arene, veilleur: veilleur ? veilleur.pv : null, veilleurY: veilleur ? Math.round(veilleur.y) : null, mode: P.mode,
             pv: P.pv, score, ennemis: ennemis.length, x: Math.round(P.x), sx: Math.round(P.x - cam), sy: Math.round(P.y),
             visuel: (() => { const d = posture(); return d.type === 'rig' ? 'marionnette' : d.an + ' ' + (d.i + 1); })() };
  };

  const img = new Image(), imgPlanche = new Image();
  img.onload = () => { imgPlanche.onload = demarrerJeu; imgPlanche.src = PLANCHE; };
  const demarrerJeu = () => {
    disposer();
    PIECES = construirePieces(img);
    PL = construirePlanche(imgPlanche);
    DECORS = [decorTerres(), decorCimetiere(), decorCryptes()];
    LUNE = construireLune(); BRUME_T = tuileBrume(); HALOS = [construireHalo(14, 1), construireHalo(16, 2)];
    construireEnnemis();
    modeTitre();
    requestAnimationFrame((t) => { avant = t; requestAnimationFrame(boucle); });
  };
  img.onerror = () => {
    disposer();
    ctx.fillStyle = ENCRE; ctx.fillRect(0, 0, W, H);
    texte('PLANCHE DU DRAGON INTROUVABLE', W / 2, H / 2 - 6, SANG_VIF, 1, 'ombre', 'centre');
    texte('RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY', W / 2, H / 2 + 8, OS, 1, 'ombre', 'centre');
  };
  img.src = ATLAS;
})();
</script>
